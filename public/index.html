<form id="botSettings">
  <h3>⚙️ Bot Ayarları</h3>
  <input type="text" id="botName" placeholder="Bot İsmi" value="BenimBot">
  <input type="text" id="serverHost" placeholder="Sunucu IP" value="aesirmc.com">
  <input type="number" id="serverPort" placeholder="Port" value="25565">
  <input type="text" id="version" placeholder="Sürüm (örn: 1.8.9)" value="1.8.9">
  <select id="authType">
    <option value="offline">Offline</option>
    <option value="microsoft">Microsoft</option>
  </select>
  <button type="submit">💾 Kaydet ve Yeniden Başlat</button>
</form>
